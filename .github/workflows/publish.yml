name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - name: Verify tag matches package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('pyhighlights/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag != version $version"; exit 1; }
      - run: twine check --strict dist/*
      - name: Verify built wheel
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          cd /tmp
          /tmp/verify/bin/python -c "import pyhighlights; print(pyhighlights.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyhighlights/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
