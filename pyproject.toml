[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhighlights"
dynamic = ["version"]
description = "A simple library implementing Select-Then-Predict (SPP) models."
readme = "README.md"
authors = [
    { name = "Federico Ruggeri", email = "federico.ruggeri6@unibo.it" }
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Adjust your minimum Python version requirement here if needed
requires-python = ">=3.10"
dependencies = [
    "cinnamon-core>=2.0.1,<3",
    "pandas>=2.0.0",
    "lightning>=2.0.0",
    "torch>=2.0.0",
    "torchmetrics>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nlp-unibo/pyhighlights"
Documentation = "https://nlp-unibo.github.io/pyhighlights/"
Source = "https://github.com/nlp-unibo/pyhighlights"
Issues = "https://github.com/nlp-unibo/pyhighlights/issues"

[project.optional-dependencies]
transformers = ["transformers>=4.0.0"]
dev = [
    "nox>=2024.3.2",
    "pytest>=7.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.20",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.setuptools.packages.find]
include = ["pyhighlights*"]

[tool.setuptools.dynamic]
version = { attr = "pyhighlights.__version__" }

[tool.ruff]
target-version = "py310"
extend-exclude = ["*.md", "docs", "docsrc"]
line-length = 88
lint.select = ["E", "F", "I", "W"]

[tool.coverage.run]
branch = true
source = ["pyhighlights"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
