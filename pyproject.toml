[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhighlights"
dynamic = ["version"]
description = "A simple library implementing Select-Then-Predict (SPP) models."
readme = "README.md"
authors = [
    { name = "Federico Ruggeri", email = "federico.ruggeri6@unibo.it" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Adjust your minimum Python version requirement here if needed
requires-python = ">=3.10"
dependencies = [
    "cinnamon-core>=2.0.0,<3",
    "lightning>=2.0.0",
    "torch>=2.0.0",
    "torchmetrics>=1.0.0",
]

[project.optional-dependencies]
transformers = ["transformers>=4.0.0"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.15.20",
    "mypy>=1.0.0"
]

[tool.setuptools.packages.find]
include = ["pyhighlights*"]

[tool.setuptools.dynamic]
version = { attr = "pyhighlights.__version__" }

[tool.ruff]
# Target Python 3.10+ compatibility
target-version = "py310"
line-length = 88
lint.select = ["E", "F", "I", "W"] # Basic styles, Pyflakes, and Import sorting